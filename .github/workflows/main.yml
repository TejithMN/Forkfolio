name: Build Forkfolio APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          # 1. Create .env and .env.example across all directories
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" > .env.example
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" > .env
          find . -type d -exec cp .env.example {}/ \; 2>/dev/null || true
          find . -type d -exec cp .env {}/ \; 2>/dev/null || true

          # 2. Locate root folder containing settings.gradle
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            cd "$PROJECT_DIR"
          fi
          echo "Building inside: $(pwd)"

          # 3. Create debug keystores
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          mkdir -p app ~/.android
          cp debug.keystore app/debug.keystore || true
          cp debug.keystore ~/.android/debug.keystore || true

          # 4. Accept Android SDK licenses
          yes | sdkmanager --licenses || true
          chmod +x gradlew || true

          # 5. Build APK
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forkfolio-app-debug
          path: "**/build/outputs/apk/debug/*.apk"
