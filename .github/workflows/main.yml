name: Build Forkfolio APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Project & Build APK
        run: |
          # Find directory containing settings.gradle.kts or build.gradle.kts
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" -o -name "build.gradle.kts" | head -n 1))
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "" ]; then
            PROJECT_DIR="."
          fi
          echo "Project located in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Generate debug keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

          # Build APK
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forkfolio-app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
