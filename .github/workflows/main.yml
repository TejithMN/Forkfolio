name: Build Forkfolio APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Auto-Keystore
        run: |
          # Locate project directory
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle*" -o -name "build.gradle.kts" | head -n 1))
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "" ]; then
            PROJECT_DIR="."
          fi
          cd "$PROJECT_DIR"

          # Create debug keystore in all required locations
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore app/debug.keystore || true
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore || true

          # Remove strict debug signing config requirement if present in build file
          find . -name "build.gradle.kts" -exec sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' {} + || true

          # Accept Android licenses and build APK
          yes | sdkmanager --licenses || true
          chmod +x gradlew || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forkfolio-app-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
